name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines. Keep it until that changes.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # No dependencies: the project is intentionally zero-install.
      - name: Validate authorities, rule packs and profiles
        run: npm run validate

      - name: Run unit and fixture tests
        run: npm test

      - name: Verify packed artifact installs and runs
        run: npm run test:packed-artifact

      - name: Validate skill frontmatter, paths and versions
        run: node scripts/validate-skill.mjs

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run prepack check
        run: npm run prepack

      # The tarball must contain exactly the runtime-manifest include set, no more and no less.
      - name: Verify tarball contents equal the manifest include set
        run: node scripts/prepack.mjs --tarball
