# Public CI. The release staging step copies this file to .github/workflows/ci.yml
# in the public clone, replacing the private ci.yml. See docs/public-release-procedure.md.
# It runs Node checks first, then builds the binary. It does not run `cargo test`
# (recorded captures do not ship) and does not run the end-to-end smoke.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check (node 22, rust stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No dependencies are required; install only if a lockfile resolves them.
      - name: Install
        run: npm ci || npm install

      - name: Validate authorities, rule packs and profiles
        run: npm run validate

      - name: Validate the skill
        run: node scripts/validate-skill.mjs

      # Run before any cargo build so the real-binary replay test skips
      # instead of running without recorded captures.
      - name: Node tests
        run: npm test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the binary
        run: cargo build -p diligent-cli --locked

  shadow-rules:
    name: shadow rules (Node vs Rust validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the native binary
        run: cargo build -p diligent-cli --locked

      - name: Run shadow rules suite
        env:
          DILIGENT_RS_BIN: ${{ github.workspace }}/target/debug/diligent-rs
        run: npm run shadow:rules

  shadow-gate:
    name: shadow gate (Node vs Rust gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the native binary
        run: cargo build -p diligent-cli --locked

      - name: Run shadow gate suite
        env:
          DILIGENT_RS_BIN: ${{ github.workspace }}/target/debug/diligent-rs
        run: npm run shadow:gate
