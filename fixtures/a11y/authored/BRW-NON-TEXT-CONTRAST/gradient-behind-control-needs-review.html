<html lang="en">
<head>

<title>Control on gradient</title>

body { background: #fff; color: #000; margin: 8px; }
</style>
</head>
<body>
<div style="padding:12px;background:linear-gradient(#fff,#ccc)">

</div>
</body>
</html>
