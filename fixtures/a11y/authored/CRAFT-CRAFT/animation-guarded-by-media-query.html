<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example Agency: sample page for craft signals</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #1b1b1b; background: #fff; }
main { padding: 16px; }
h1, h2, h3, h4, p, ul { margin: 0 0 16px 0; }
p { max-width: 560px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: no-preference) { .spin { display: inline-block; animation: spin 2s linear infinite; animation-play-state: paused; animation-delay: -0.5s; } .fade { transition: opacity 0.3s; } }
</style>
</head>
<body>
<main>
<h1>Motion</h1>
<p><span class="spin">*</span> <span class="fade">Fade</span></p>
</main>
</body>
</html>
