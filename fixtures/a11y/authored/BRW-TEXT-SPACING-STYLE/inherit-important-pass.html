<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Important inherit</title>
<style>
body { background: #fff; color: #000; margin: 8px; }
</style>
</head>
<body>
<p style="letter-spacing:0.05em"><span style="letter-spacing:inherit !important">Inherit with !important does not lock a value.</span></p>
</body>
