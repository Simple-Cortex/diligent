<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrolling text box</title>
<style>
body { background: #fff; color: #000; margin: 8px; }
.box { width: 200px; height: 2.4em; overflow: auto; border: 1px solid #444; }
</style>
</head>
<body>
<div class="box">Plain words in a short sentence that fills two lines before any spacing is applied here.</div>
<p style="word-spacing:0.1em">Spacing set without !important.</p>
</body>
</html>
