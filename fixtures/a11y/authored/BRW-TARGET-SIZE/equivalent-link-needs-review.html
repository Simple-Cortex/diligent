<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equivalent links</title>
<style>
body { background: #fff; color: #000; margin: 8px; }
.row2 { display: flex; gap: 0; }
.a24 { display: block; width: 24px; height: 24px; background: #ccc; }
.a20 { display: block; width: 20px; height: 20px; background: #999; }
</style>
</head>
<body>
<div class="row2">
<a class="a24" href="https://example.gov/" aria-label="Home"></a>
<a class="a20" href="https://example.gov/" aria-label="Home icon"></a>
</div>
</body>
</html>
