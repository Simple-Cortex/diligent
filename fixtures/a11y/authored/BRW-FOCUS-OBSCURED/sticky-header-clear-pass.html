<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header clear of focus</title>
<style>
body { background: #fff; color: #000; margin: 8px; }
.hdr { position: sticky; top: 0; height: 40px; background: #ddd; margin: 0; }
.hdr p { margin: 0; }
.lnk { display: block; width: 120px; height: 20px; }
</style>
</head>
<body>
<header class="hdr"><p>Site header</p></header>
<a class="lnk" href="https://example.gov/">Focus target</a>
</body>
</html>
