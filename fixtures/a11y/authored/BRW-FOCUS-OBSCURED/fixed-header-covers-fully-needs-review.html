<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header covers focus</title>
<style>
body { background: #fff; color: #000; margin: 8px; }
.hdr { position: fixed; top: 0; left: 0; right: 0; height: 80px; background: #ddd; margin: 0; }
.lnk { position: absolute; top: 20px; left: 10px; display: block; width: 120px; height: 20px; }
</style>
</head>
<body>
<header class="hdr"><p>Site header</p></header>
<a class="lnk" href="https://example.gov/">Focus target</a>
</body>
</html>
